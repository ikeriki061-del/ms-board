<html lang="ja">
<head>

<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg: #f6f5f1; --color-panel: #ffffff; --color-fg: #1d1c1a; --color-fg-muted: #6b6862;
  --color-border-line: #e4e1da; --color-ok: #1f8a5b; --color-bad: #c2412d; --color-warn: #b7791f;
  --cds-chart-grid: #ece9e3; --cds-chart-axis: #b9b5ad; --cds-chart-reference: #8f8b84;
  --cds-surface-popover: #ffffff; --cds-border: #dcd8d0; --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.10); --cds-text-secondary: #55524c;
  --g1: #2f6fd6; --g2: #e07b39; --g3: #2a9d8f; --g4: #b5517e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #161614; --color-panel: #1f1f1c; --color-fg: #eeece6; --color-fg-muted: #a29f97;
    --color-border-line: #33322e; --color-ok: #45c08a; --color-bad: #ef7a63; --color-warn: #e0a84a;
    --cds-chart-grid: #2c2b28; --cds-chart-axis: #57554f; --cds-chart-reference: #8a877f;
    --cds-surface-popover: #262623; --cds-border: #3a3935; --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.45); --cds-text-secondary: #bdb9b0;
    --g1: #6b9cf0; --g2: #f0a066; --g3: #4cc2b3; --g4: #de7fab;
  }
}
:root[data-theme="dark"] {
  --color-bg: #161614; --color-panel: #1f1f1c; --color-fg: #eeece6; --color-fg-muted: #a29f97;
  --color-border-line: #33322e; --color-ok: #45c08a; --color-bad: #ef7a63; --color-warn: #e0a84a;
  --cds-chart-grid: #2c2b28; --cds-chart-axis: #57554f; --cds-chart-reference: #8a877f;
  --cds-surface-popover: #262623; --cds-border: #3a3935; --cds-shadow-popover: 0 6px 20px rgba(0,0,0,.45); --cds-text-secondary: #bdb9b0;
  --g1: #6b9cf0; --g2: #f0a066; --g3: #4cc2b3; --g4: #de7fab;
}
:root {
  --font-anthropic-sans: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
  --font-anthropic-serif: "Noto Serif JP", "Hiragino Mincho ProN", serif;
  --cds-font-size-caption: 12.5px; --cds-font-size-body: 15px; --cds-font-size-heading: 15px; --cds-font-size-title: 22px;
  --cds-font-weight-medium: 600;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 14px; --cds-gap-lg: 22px; --cds-gap-xl: 32px;
  --cds-pad-xs: 5px; --cds-pad-sm: 9px; --cds-pad-md: 13px; --cds-pad-lg: 18px; --cds-pad-xl: 28px;
  --cds-radius: 10px; --cds-ease-out: cubic-bezier(.2,.7,.2,1); --cds-dur-slow: 400ms;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); -webkit-text-size-adjust: 100%; }
#dash-root { max-width: 1180px; margin: 0 auto; padding: 28px 16px 60px; overflow-x: hidden; }
.dash-skeleton { color: transparent !important; background: color-mix(in srgb, var(--color-fg) 8%, transparent); border-radius: 6px; }
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#lock form { width: min(100%, 340px); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
#lock h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 22px; margin: 0; }
#lock p { margin: 0; font-size: 13px; color: var(--color-fg-muted); line-height: 1.6; }
#lock input[type=password] { font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); }
#lock input[type=password]:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
#lock label.keep { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--color-fg-muted); }
#lock button { font: inherit; font-weight: 600; padding: 11px; border-radius: 8px; border: none; background: var(--color-fg); color: var(--color-bg); cursor: pointer; }
#lock button:disabled { opacity: .5; cursor: default; }
#lock .err { color: var(--color-bad); font-size: 13px; min-height: 1.2em; }
#bar { display: flex; justify-content: flex-end; gap: 10px; max-width: 1180px; margin: 0 auto; padding: 12px 16px 0; font-size: 12.5px; color: var(--color-fg-muted); }
#bar button { font: inherit; background: none; border: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<div id="lock">
  <form id="lock-form" autocomplete="off">
    <h1>Board</h1>
    <p>合言葉を入れてください。</p>
    <input type="password" id="pass" aria-label="合言葉" autocomplete="current-password" required>
    <label class="keep"><input type="checkbox" id="keep" checked> この端末で覚えておく</label>
    <button type="submit" id="go">開く</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="bar" hidden><span id="built"></span><button type="button" id="forget">この端末の合言葉を消す</button></div>
<div id="dash-root" hidden></div>

      calc: (id, o) => { calcs[id] = o; },
      onData: (cb) => { cbs.push(cb); },
      data: (id) => store[id] ? { status: 'ok', data: store[id] } : { status: 'loading', data: [] },
      loader() {}, setLink() {}
    };
    const root = document.getElementById('dash-root');
    const tpl = document.createElement('template'); tpl.innerHTML = p.html;
    const scripts = [...tpl.content.querySelectorAll('script')]; scripts.forEach(s => s.remove());
    root.appendChild(tpl.content);
    scripts.forEach(s => { const n = document.createElement('script'); n.textContent = s.textContent; document.body.appendChild(n); });
    for (const [id, text] of Object.entries(p.data)) store[id] = parseCsv(text);
    let left = Object.keys(calcs), guard = 0;
    while (left.length && guard++ < 20) {
      left = left.filter(id => {
        const c = calcs[id];
        if (!c.inputs.every(i => store[i])) return true;
        try { store[id] = c.fn(...c.inputs.map(i => store[i])); } catch (e) { console.error(id, e); store[id] = []; }
        return false;
      });
    }
    document.querySelectorAll('.dash-skeleton').forEach(e => e.classList.remove('dash-skeleton'));
    const run = () => cbs.forEach(cb => { try { cb(); } catch (e) { console.error(e); } });
    document.getElementById('lock').hidden = true; document.getElementById('lock').style.display = 'none';
    root.hidden = false; document.getElementById('bar').hidden = false;
    document.getElementById('built').textContent = p.built + ' 更新';
    run();
    let t; let w = window.innerWidth;
    window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - w) < 40) return; w = window.innerWidth; clearTimeout(t); t = setTimeout(run, 250); });
  }
  const form = document.getElementById('lock-form'), err = document.getElementById('err'), go = document.getElementById('go');
  async function tryOpen(pass, remember) {
    go.disabled = true; err.textContent = '';
    try {
      const p = await open(pass);
      if (remember) { try { localStorage.setItem(KEY, pass); } catch (e) {} }
      boot(p);
    } catch (e) {
      err.textContent = '合言葉が違います。';
      try { localStorage.removeItem(KEY); } catch (e2) {}
    } finally { go.disabled = false; }
  }
  form.addEventListener('submit', (e) => { e.preventDefault(); tryOpen(document.getElementById('pass').value, document.getElementById('keep').checked); });
  document.getElementById('forget').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); });
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) tryOpen(saved, true);
})();
</script>
</body>
